name: release

# Push a tag such as v0.0.1 to build, test and publish a release: the Windows (WPF) app as a zip,
# the Avalonia app for Linux as a tar.gz and for macOS as a zipped .app bundle.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  cross-platform:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          version='${{ github.ref_name }}'
          version=${version#v}
          dotnet publish src/PodcastRecorder.Avalonia --configuration Release --runtime ${{ matrix.rid }} --self-contained \
            -p:Version=$version --output publish/PodcastRecorder
          if [ "$RUNNER_OS" = "macOS" ]; then
            # "Podcast Recorder.app" in a zip, which Finder opens with a double click.
            brew install librsvg
            bash src/PodcastRecorder.Avalonia/macOS/package-app.sh publish/PodcastRecorder "$version" publish
            ditto -c -k --keepParent "publish/Podcast Recorder.app" "PodcastRecorder-$version-${{ matrix.rid }}.zip"
          else
            tar -czf "PodcastRecorder-$version-${{ matrix.rid }}.tar.gz" -C publish PodcastRecorder
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}
          path: |
            PodcastRecorder-*.tar.gz
            PodcastRecorder-*.zip

  release:
    needs: cross-platform
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/PodcastRecorder.App --configuration Release --runtime win-x64 --self-contained `
            -p:Version=$version --output publish/PodcastRecorder
          Compress-Archive -Path publish/PodcastRecorder -DestinationPath "PodcastRecorder-$version-win-x64.zip"
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem PodcastRecorder-*.zip, PodcastRecorder-*.tar.gz).FullName `
            --title 'Podcast Recorder ${{ github.ref_name }}' --generate-notes
