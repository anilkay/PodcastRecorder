name: release

# Push a tag such as v0.0.1 to build, test and publish a Windows release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/PodcastRecorder.App --configuration Release --runtime win-x64 --self-contained `
            -p:Version=$version --output publish/PodcastRecorder
          Compress-Archive -Path publish/PodcastRecorder -DestinationPath "PodcastRecorder-$version-win-x64.zip"
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem PodcastRecorder-*.zip).FullName `
            --title 'Podcast Recorder ${{ github.ref_name }}' --generate-notes
