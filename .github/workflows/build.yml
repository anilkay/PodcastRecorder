name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # The Avalonia app and the audio engine on Linux and macOS.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install LAME and ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y libmp3lame0 ffmpeg; else brew install lame ffmpeg; fi
      - run: dotnet build src/PodcastRecorder.Avalonia --configuration Release
      - run: dotnet test tests/PodcastRecorder.Audio.Tests --configuration Release
      - name: Package the macOS app and open it
        if: runner.os == 'macOS'
        run: |
          brew install librsvg
          dotnet publish src/PodcastRecorder.Avalonia --configuration Release --runtime osx-arm64 --self-contained \
            --output publish/PodcastRecorder
          bash src/PodcastRecorder.Avalonia/macOS/package-app.sh publish/PodcastRecorder 0.0.0 publish
          ditto -c -k --keepParent "publish/Podcast Recorder.app" PodcastRecorder-osx-arm64.zip
          # Opened the way a double click does; it must still be running a few seconds later.
          open "publish/Podcast Recorder.app"
          sleep 15
          pgrep -x PodcastRecorder.Avalonia
          pkill -x PodcastRecorder.Avalonia
      # The packaged app, to try on a Mac before a release.
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: PodcastRecorder-osx-arm64-app
          path: PodcastRecorder-osx-arm64.zip
      - name: Package the Linux AppImage and run it
        if: runner.os == 'Linux'
        run: |
          dotnet publish src/PodcastRecorder.Avalonia --configuration Release --runtime linux-x64 --self-contained \
            --output publish/PodcastRecorder
          bash src/PodcastRecorder.Avalonia/linux/get-appimagetool.sh
          APPIMAGETOOL=$PWD/appimagetool APPIMAGE_RUNTIME=$PWD/runtime-x86_64 \
            bash src/PodcastRecorder.Avalonia/linux/package-appimage.sh publish/PodcastRecorder 0.0.0 PodcastRecorder-x86_64.AppImage
          command -v xvfb-run || sudo apt-get install -y xvfb
          # On a virtual display; killed by the timeout (124) means it was still running after 15 s.
          code=0
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 15 ./PodcastRecorder-x86_64.AppImage || code=$?
          echo "exit code $code"
          test "$code" -eq 124
      # The AppImage, to try on a Linux desktop before a release.
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: PodcastRecorder-linux-appimage
          path: PodcastRecorder-x86_64.AppImage
